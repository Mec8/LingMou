<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵眸 Dashboard v2.0 - 多 Agent 协调平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --warning-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --danger-gradient: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            --info-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        /* 布局容器 */
        .layout-container {
            display: flex;
            min-height: calc(100vh - 40px);
            gap: 20px;
        }
        
        /* 侧边栏 */
        .sidebar {
            width: 260px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 20px;
            height: calc(100vh - 40px);
            overflow-y: auto;
        }
        
        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            padding: 0 10px;
        }
        
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .nav-item {
            padding: 16px 20px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: #4a5568;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .nav-item:hover {
            background: rgba(102, 126, 234, 0.1);
            transform: translateX(4px);
        }
        
        .nav-item.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
        }
        
        .nav-icon {
            font-size: 20px;
        }
        
        /* 主内容区 */
        .main-content {
            flex: 1;
            max-width: calc(100% - 280px);
            padding: 20px 0;
        }
        
        .page {
            display: none;
        }
        
        .page.active {
            display: block;
        }
        
        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary-gradient);
        }
        
        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.15);
        }
        
        .stat-value {
            font-size: 48px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .stat-label {
            color: #718096;
            font-size: 16px;
            font-weight: 600;
        }
        
        /* 内容区块 */
        .content-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.1);
        }
        
        .section-title {
            font-size: 28px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Agent 列表 */
        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .agent-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(248,250,252,0.9));
            border-radius: 16px;
            padding: 25px;
            border: 2px solid rgba(102, 126, 234, 0.1);
            transition: all 0.3s;
        }
        
        .agent-card:hover {
            border-color: rgba(102, 126, 234, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 12px 48px rgba(102, 126, 234, 0.15);
        }
        
        .agent-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .agent-avatar {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .agent-name {
            font-size: 20px;
            font-weight: 700;
            color: #2d3748;
        }
        
        .agent-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        
        .status-active {
            background: rgba(16, 185, 129, 0.15);
            color: #059669;
        }
        
        .status-idle {
            background: rgba(245, 158, 11, 0.15);
            color: #d97706;
        }
        
        .agent-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid rgba(102, 126, 234, 0.1);
        }
        
        .agent-stat {
            text-align: center;
        }
        
        .agent-stat-value {
            font-size: 24px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .agent-stat-label {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }
        
        /* Token 统计 */
        .token-chart {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .token-bar {
            background: rgba(102, 126, 234, 0.1);
            border-radius: 10px;
            padding: 20px;
        }
        
        .token-bar-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .token-bar-label {
            font-weight: 600;
            color: #4a5568;
        }
        
        .token-bar-value {
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .token-bar-progress {
            height: 12px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 6px;
            overflow: hidden;
        }
        
        .token-bar-fill {
            height: 100%;
            background: var(--primary-gradient);
            border-radius: 6px;
            transition: width 0.5s ease;
        }
        
        /* 按钮 */
        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: var(--primary-gradient);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }
        
        /* 表格 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .data-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #718096;
            border-bottom: 2px solid rgba(102, 126, 234, 0.1);
        }
        
        .data-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(102, 126, 234, 0.05);
            color: #4a5568;
        }
        
        .data-table tr:hover {
            background: rgba(102, 126, 234, 0.05);
        }
    </style>
</head>
<body>
    <div class="layout-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="logo">🦞 灵眸</div>
            <nav class="nav-menu">
                <button class="nav-item active" onclick="switchPage('overview')">
                    <span class="nav-icon">📊</span>
                    <span>概览</span>
                </button>
                <button class="nav-item" onclick="switchPage('agents')">
                    <span class="nav-icon">🤖</span>
                    <span>Agent</span>
                </button>
                <button class="nav-item" onclick="switchPage('tokens')">
                    <span class="nav-icon">💰</span>
                    <span>Token</span>
                </button>
                <button class="nav-item" onclick="switchPage('tasks')">
                    <span class="nav-icon">📋</span>
                    <span>任务</span>
                </button>
            </nav>
        </aside>
        
        <!-- 主内容区 -->
        <main class="main-content">
        <!-- 概览页面 -->
        <div id="overview" class="page active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-agents">0</div>
                    <div class="stat-label">🤖 活跃 Agent</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-tasks">0</div>
                    <div class="stat-label">📋 总任务数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-tokens">0</div>
                    <div class="stat-label">💰 Token 消耗</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-cost">¥0</div>
                    <div class="stat-label">💵 总费用</div>
                </div>
            </div>
            
            <div class="content-section">
                <div class="section-header">
                    <h2 class="section-title">🎯 系统状态</h2>
                </div>
                <div id="system-status">
                    <p style="color: #718096;">正在加载...</p>
                </div>
            </div>
        </div>
        
        <!-- Agent 页面 -->
        <div id="agents" class="page">
            <div class="content-section">
                <div class="section-header">
                    <h2 class="section-title">🤖 Agent 管理</h2>
                    <button class="btn btn-primary" onclick="refreshAgents()">🔄 刷新</button>
                </div>
                <div class="agent-grid" id="agent-list">
                    <!-- Agent 卡片将由 JS 动态生成 -->
                </div>
            </div>
        </div>
        
        <!-- Token 页面 -->
        <div id="tokens" class="page">
            <div class="content-section">
                <div class="section-header">
                    <h2 class="section-title">💰 Token 统计</h2>
                    <button class="btn btn-primary" onclick="refreshTokens()">🔄 刷新</button>
                </div>
                <div class="token-chart" id="token-chart">
                    <!-- Token 图表将由 JS 动态生成 -->
                </div>
            </div>
            
            <div class="content-section">
                <div class="section-header">
                    <h2 class="section-title">📊 使用明细</h2>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>模型</th>
                            <th>输入 Token</th>
                            <th>输出 Token</th>
                            <th>总计</th>
                            <th>费用</th>
                        </tr>
                    </thead>
                    <tbody id="token-details">
                        <!-- 明细将由 JS 动态生成 -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- 任务页面 -->
        <div id="tasks" class="page">
            <div class="content-section">
                <div class="section-header">
                    <h2 class="section-title">📋 任务管理</h2>
                    <button class="btn btn-primary" onclick="refreshTasks()">🔄 刷新</button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>任务 ID</th>
                            <th>标题</th>
                            <th>状态</th>
                            <th>优先级</th>
                            <th>Agent</th>
                            <th>时间</th>
                        </tr>
                    </thead>
                    <tbody id="task-list">
                        <!-- 任务列表将由 JS 动态生成 -->
                    </tbody>
                </table>
            </div>
        </div>
        </main>
    </div>
    
    <script>
        // 页面切换
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            event.currentTarget.classList.add('active');
            
            // 加载对应数据
            if(pageId === 'agents') loadAgents();
            if(pageId === 'tokens') loadTokens();
            if(pageId === 'tasks') loadTasks();
        }
        
        // 加载概览数据
        async function loadOverview() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                if(data.code === 0) {
                    document.getElementById('stat-agents').textContent = data.data.agents || 3;
                    document.getElementById('stat-tasks').textContent = data.data.sessions || 0;
                    document.getElementById('stat-tokens').textContent = (data.data.token_usage || 0).toLocaleString();
                    document.getElementById('stat-cost').textContent = '¥' + (data.data.token_cost || 0).toFixed(2);
                }
            } catch(e) {
                console.error('加载失败:', e);
            }
        }
        
        // 加载 Agent 列表
        async function loadAgents() {
            const agentList = document.getElementById('agent-list');
            agentList.innerHTML = '<p style="color: #718096; text-align: center; padding: 40px;">加载中...</p>';
            
            // 模拟数据（后续替换为真实 API）
            const agents = [
                { name: 'main', status: 'active', tasks: 150, tokens: 50000, success: 98 },
                { name: 'feishu_main', status: 'active', tasks: 120, tokens: 35000, success: 97 },
                { name: 'qqbot', status: 'idle', tasks: 90, tokens: 25000, success: 95 }
            ];
            
            agentList.innerHTML = agents.map(agent => `
                <div class="agent-card">
                    <div class="agent-header">
                        <div class="agent-avatar">🤖</div>
                        <div>
                            <div class="agent-name">${agent.name}</div>
                            <span class="agent-status status-${agent.status}">${agent.status === 'active' ? '🟢 工作中' : '🟡 空闲'}</span>
                        </div>
                    </div>
                    <div class="agent-stats">
                        <div class="agent-stat">
                            <div class="agent-stat-value">${agent.tasks}</div>
                            <div class="agent-stat-label">任务数</div>
                        </div>
                        <div class="agent-stat">
                            <div class="agent-stat-value">${(agent.tokens/1000).toFixed(1)}k</div>
                            <div class="agent-stat-label">Token</div>
                        </div>
                        <div class="agent-stat">
                            <div class="agent-stat-value">${agent.success}%</div>
                            <div class="agent-stat-label">成功率</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // 加载 Token 统计
        async function loadTokens() {
            const tokenChart = document.getElementById('token-chart');
            const tokenDetails = document.getElementById('token-details');
            
            // 模拟数据
            const tokenData = {
                total: 115246,
                cost: 0.48,
                byModel: [
                    { model: 'qwen3.5-plus', input: 112952, output: 2294, total: 115246, cost: 0.48 }
                ]
            };
            
            // 图表
            tokenChart.innerHTML = `
                <div class="token-bar">
                    <div class="token-bar-header">
                        <span class="token-bar-label">总消耗</span>
                        <span class="token-bar-value">${tokenData.total.toLocaleString()} tokens</span>
                    </div>
                    <div class="token-bar-progress">
                        <div class="token-bar-fill" style="width: 100%"></div>
                    </div>
                </div>
                <div class="token-bar">
                    <div class="token-bar-header">
                        <span class="token-bar-label">总费用</span>
                        <span class="token-bar-value">¥${tokenData.cost.toFixed(2)}</span>
                    </div>
                </div>
            `;
            
            // 明细
            tokenDetails.innerHTML = tokenData.byModel.map(m => `
                <tr>
                    <td><strong>${m.model}</strong></td>
                    <td>${m.input.toLocaleString()}</td>
                    <td>${m.output.toLocaleString()}</td>
                    <td><strong>${m.total.toLocaleString()}</strong></td>
                    <td><strong>¥${m.cost.toFixed(2)}</strong></td>
                </tr>
            `).join('');
        }
        
        // 加载任务列表
        async function loadTasks() {
            const taskList = document.getElementById('task-list');
            
            // 模拟数据
            const tasks = [
                { id: 'task_001', title: '生成新闻早报', status: 'completed', priority: 'P2', agent: 'feishu_main', time: '2026-03-26 08:00' },
                { id: 'task_002', title: '系统安全检查', status: 'running', priority: 'P1', agent: 'main', time: '2026-03-26 09:30' },
                { id: 'task_003', title: '每日反思提醒', status: 'pending', priority: 'P3', agent: 'qqbot', time: '2026-03-26 23:00' }
            ];
            
            taskList.innerHTML = tasks.map(t => `
                <tr>
                    <td><code>${t.id}</code></td>
                    <td>${t.title}</td>
                    <td><span style="color: ${t.status === 'completed' ? '#10b981' : t.status === 'running' ? '#3b82f6' : '#f59e0b'}">● ${t.status}</span></td>
                    <td><span style="background: rgba(102, 126, 234, 0.1); color: #667eea; padding: 4px 12px; border-radius: 12px; font-size: 12px;">${t.priority}</span></td>
                    <td>${t.agent}</td>
                    <td style="color: #718096;">${t.time}</td>
                </tr>
            `).join('');
        }
        
        // 刷新函数
        function refreshAgents() { loadAgents(); }
        function refreshTokens() { loadTokens(); }
        function refreshTasks() { loadTasks(); }
        
        // 页面加载时初始化
        loadOverview();
        setInterval(loadOverview, 30000); // 每 30 秒刷新概览
    </script>
</body>
</html>
